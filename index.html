
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyGuard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1418;color:#f2f6f5;
font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
.app{max-width:560px;margin:auto;padding:24px 17px}
header{display:flex;justify-content:space-between;align-items:center;
margin-bottom:30px}
header strong{font-size:21px}
header small,.muted{color:#99a9a8}
h1{font-size:28px;margin:5px 0}
.muted{font-size:13px;line-height:1.7}
.card{border:1px solid #2a3b3e;background:#152127;
border-radius:20px;padding:20px;margin-top:16px}
.label{font-size:12px;font-weight:bold;color:#a0b3b4}
.timer{text-align:center;font-size:46px;font-weight:bold;
margin:15px 0;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:#0c161b;border-radius:12px;padding:12px 3px}
.stats strong{display:block;font-size:17px}
.stats span{display:block;font-size:11px;color:#99aeaf}
video{width:100%;aspect-ratio:4/3;object-fit:cover;
background:#05090c;border-radius:15px;transform:scaleX(-1)}
.status{font-weight:bold;color:#8ce7cf;margin:10px 0}
.warning{color:#ffb986}.error{color:#ffb4b4}
button,select{font-family:inherit}
button{cursor:pointer;border:0;border-radius:14px;
padding:15px;font-size:15px;font-weight:bold}
button:disabled{opacity:.45}
.primary{background:#87e4c9;color:#062a21;width:100%;margin:15px 0}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secondary{background:#263b43;color:#e4f1ee}
.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:13px}
.settings select{background:#20313a;color:white;padding:8px;
border:1px solid #446069;border-radius:8px}
.settings label{font-size:13px}
.history{padding:0;list-style:none}
.history li{padding:13px 4px;border-top:1px solid #34464d;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header>
<strong>◉ StudyGuard</strong>
<small>STUDY MONITOR</small>
</header>

<div class="label">FOCUS SESSION</div>
<h1>集中を、続けよう。</h1>
<p class="muted">iPhoneを机に立てて、上半身が映るようにしてください。</p>

<section class="card">
<div class="label">学習セッション</div>
<div class="timer" id="timer">00:00:00</div>
<div class="stats">
<div><strong id="present">00:00</strong><span>在席推定</span></div>
<div><strong id="away">00:00</strong><span>離席推定</span></div>
<div><strong id="warnings">0回</strong><span>注意回数</span></div>
</div>
</section>

<section class="card">
<div class="label">LIVE CAMERA</div>
<video id="video" autoplay muted playsinline></video>
<p class="status" id="status">● 監視待機中</p>
<p class="muted" id="message">映像は保存・送信されません。</p>
</section>

<button id="start" class="primary">▶ 監視を開始する</button>
<div class="buttons">
<button id="break" class="secondary" disabled>☕ 休憩する</button>
<button id="finish" class="secondary" disabled>■ 終了・保存</button>
</div>

<section class="card">
<div class="label">監視設定</div>
<div class="settings">
<label>注意まで
<select id="threshold">
<option value="60">60秒（優しい）</option>
<option value="30" selected>30秒（普通）</option>
<option value="10">10秒（厳しい）</option>
</select>
</label>
<label><input type="checkbox" id="voice" checked> 音声注意</label>
<button id="test" class="secondary" style="padding:9px">音声テスト</button>
</div>
</section>

<section class="card">
<div class="label">学習履歴（直近10回）</div>
<ul class="history" id="history">
<li>まだ記録はありません。</li>
</ul>
</section>

<p class="muted">
人物の有無を推定する試作品です。実際の集中状態は判断できません。
画面消灯やアプリ切替中は監視できません。
</p>
</div>

<script type="module">
const $ = id => document.getElementById(id);

const BASE =
 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304';

const MODEL =
 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

let detector=null,stream=null,session=null;
let phase='idle',seenAt=0,awaySince=0;
let warned=false,lastInfer=0,raf=0;

const historyKey='studyguard_history';
const settingsKey='studyguard_settings';

const saved=JSON.parse(localStorage.getItem(settingsKey)||'{}');
$('threshold').value=saved.threshold||'30';
$('voice').checked=saved.voice!==false;

function saveSettings(){
 localStorage.setItem(settingsKey,JSON.stringify({
  threshold:$('threshold').value,
  voice:$('voice').checked
 }));
}
$('threshold').onchange=saveSettings;
$('voice').onchange=saveSettings;

function status(title,detail,type=''){
 $('status').textContent=title;
 $('status').className='status '+type;
 $('message').textContent=detail;
}

function speak(text){
 if(!$('voice').checked||!('speechSynthesis' in window))return;
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';
  u.rate=1.05;
  speechSynthesis.speak(u);
 }catch(e){}
}
$('test').onclick=()=>speak('勉強を再開しましょう。');

function time(n){
 let x=Math.floor(Math.max(0,n));
 return [
  Math.floor(x/3600),
  Math.floor(x%3600/60),
  x%60
 ].map(v=>String(v).padStart(2,'0')).join(':');
}
function short(n){return time(n).slice(3)}

function render(){
 if(session){
  $('timer').textContent=time(session.elapsed);
  $('present').textContent=short(session.present);
  $('away').textContent=short(session.away);
  $('warnings').textContent=session.warnings+'回';
 }
 $('start').textContent=
  phase==='running'?'✓ 監視中':
  phase==='loading'?'読み込み中…':
  phase==='idle'?'▶ 監視を開始する':'▶ 監視を再開する';

 $('start').disabled=phase==='running'||phase==='loading';
 $('break').disabled=!session||phase==='loading';
 $('break').textContent=
  phase==='break'?'▶ 休憩を終了':'☕ 休憩する';
 $('finish').disabled=!session||phase==='loading';
}

function stopCamera(){
 cancelAnimationFrame(raf);
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
 $('video').srcObject=null;
}

async function loadDetector(){
 if(detector)return;
 const {FilesetResolver,PoseLandmarker}=
  await import(BASE+'/vision_bundle.mjs');
 const vision=await FilesetResolver.forVisionTasks(BASE+'/wasm');
 detector=await PoseLandmarker.createFromOptions(vision,{
  baseOptions:{modelAssetPath:MODEL,delegate:'CPU'},
  runningMode:'VIDEO',
  numPoses:1,
  minPoseDetectionConfidence:0.55,
  minTrackingConfidence:0.5
 });
}

async function start(){
 if(phase==='loading'||phase==='running')return;
 const creating=!session;
 phase='loading';
 status('● カメラを準備中','カメラの使用を許可してください。');
 render();

 try{
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:'user',
    width:{ideal:640},
    height:{ideal:480}
   }
  });
  $('video').srcObject=stream;
  await $('video').play();

  status('● AIモデルを読み込み中','初回は通信が必要です。');
  await loadDetector();

  if(creating){
   session={
    started:new Date().toISOString(),
    elapsed:0,present:0,away:0,
    unknown:0,warnings:0,last:Date.now()
   };
  }

  session.last=Date.now();
  phase='running';
  seenAt=Date.now();
  awaySince=0;
  warned=false;
  lastInfer=0;
  status('● 監視中','人物を検出しています。');
  render();
  loop();
 }catch(e){
  stopCamera();
  phase=session?'paused':'idle';
  status('● 開始できませんでした',
   e.message||'カメラの起動に失敗しました。','error');
  render();
 }
}

function loop(){
 if(phase!=='running')return;
 raf=requestAnimationFrame(loop);

 const now=performance.now();
 if(now-lastInfer<450||$('video').readyState<2)return;
 lastInfer=now;

 try{
  const result=detector.detectForVideo($('video'),now);
  const found=!!(result.landmarks&&result.landmarks.length);
  const t=Date.now();

  if(found){
   seenAt=t;
   awaySince=0;
   warned=false;
   status('● 在席を確認中','学習を続けましょう。');
  }else if(t-seenAt>3000){
   if(!awaySince)awaySince=t;
   const seconds=(t-awaySince)/1000;
   status('● 離席の可能性',
    Math.floor(seconds)+'秒間、人物が検出できません。',
    'warning');

   if(seconds>=Number($('threshold').value)&&!warned){
    warned=true;
    session.warnings++;
    status('● 勉強を再開してください',
     '離席が一定時間続いています。','warning');
    speak('勉強に戻ってください。');
    render();
   }
  }
 }catch(e){
  phase='paused';
  stopCamera();
  status('● 監視中断',
   '映像解析に失敗しました。再開してください。','error');
  render();
 }
}

function pause(){
 if(phase==='running'){
  phase='break';
  stopCamera();
  status('☕ 休憩中','休憩時間は学習時間に含まれません。');
 }else if(phase==='break'){
  phase='paused';
  status('● 再開準備完了','監視を再開してください。');
 }
 render();
}

function finish(){
 if(!session)return;
 stopCamera();
 const data=JSON.parse(localStorage.getItem(historyKey)||'[]');
 data.unshift({
  date:new Date().toLocaleString('ja-JP'),
  ...session
 });
 localStorage.setItem(historyKey,JSON.stringify(data.slice(0,50)));
 session=null;
 phase='idle';
 $('timer').textContent='00:00:00';
 $('present').textContent='00:00';
 $('away').textContent='00:00';
 $('warnings').textContent='0回';
 status('✓ セッション保存済み','お疲れさまでした。');
 render();
 showHistory();
}

function showHistory(){
 const data=JSON.parse(localStorage.getItem(historyKey)||'[]');
 $('history').innerHTML=data.length?
  data.slice(0,10).map(s=>
   `<li>${s.date.replace(/[<>]/g,'')} —
    学習 ${short(s.elapsed)} /
    在席 ${short(s.present)} /
    注意 ${s.warnings}回</li>`
  ).join(''):
  '<li>まだ記録はありません。</li>';
}

setInterval(()=>{
 if(!session||phase!=='running')return;
 const now=Date.now();
 const delta=Math.max(0,Math.min((now-session.last)/1000,2));
 session.last=now;
 session.elapsed+=delta;
 if(awaySince)session.away+=delta;
 else if(now-seenAt<=3000)session.present+=delta;
 else session.unknown+=delta;
 render();
},1000);

$('start').onclick=start;
$('break').onclick=pause;
$('finish').onclick=finish;

document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&phase==='running'){
  phase='paused';
  stopCamera();
  status('● 監視中断',
   '画面を離れたため停止しました。戻ったら再開してください。');
  render();
 }
});

showHistory();
render();
</script>
</body>
</html>
