
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1418">
<title>StudyGuard v4</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1418;color:#f2f6f5;
font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
.app{max-width:550px;margin:auto;padding:24px 16px}
header{display:flex;justify-content:space-between;align-items:center}
header strong{font-size:23px}
small,.muted{color:#9aafaf}
h1{font-size:27px;margin:24px 0 6px}
.muted{font-size:13px;line-height:1.6}
.card{background:#152127;border:1px solid #2a3b3e;
border-radius:18px;padding:19px;margin-top:16px}
.label{font-size:12px;font-weight:bold;color:#a9c2c0}
.timer{font-size:45px;text-align:center;font-weight:bold;
font-variant-numeric:tabular-nums;margin:17px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stats div{background:#0c171c;border-radius:12px;
padding:12px 3px;text-align:center}
.stats strong{display:block;font-size:17px}
.stats span{font-size:11px;color:#a0b5b7}
video{width:100%;aspect-ratio:4/3;object-fit:cover;
border-radius:14px;background:#050b0f;transform:scaleX(-1)}
.status{font-weight:bold;color:#88e5ca;margin:12px 0 5px}
.warn{color:#ffbc84}
.error{color:#ff9898}
button{border:0;border-radius:12px;padding:14px;
font-size:14px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45}
.primary{width:100%;background:#89e7cb;color:#082a22;margin-top:15px}
.secondary{background:#29404a;color:#edf5f4}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
label{font-size:13px}
select{padding:9px;background:#233740;color:white;
border:1px solid #45606a;border-radius:8px}
.settings{display:flex;flex-wrap:wrap;gap:12px;
align-items:center;margin-top:14px}
.notice{background:#34271e;border-radius:12px;
padding:12px;color:#ffd4a9;font-size:12px;line-height:1.6}
.history{padding:0;list-style:none}
.history li{padding:12px 0;border-top:1px solid #34454a;
font-size:13px}
</style>
</head>
<body>
<div class="app">
<header>
<strong>◉ StudyGuard</strong>
<small>v4 · 安定化版</small>
</header>

<h1>集中を、続けよう。</h1>
<p class="muted">iPhoneを机に立てて、上半身が映るようにしてください。</p>

<section class="card">
<div class="label">学習セッション</div>
<div class="timer" id="timer">00:00:00</div>
<div class="stats">
<div><strong id="present">00:00</strong><span>在席</span></div>
<div><strong id="away">00:00</strong><span>離席・切替</span></div>
<div><strong id="warnings">0回</strong><span>注意</span></div>
</div>
</section>

<section class="card">
<div class="label">LIVE CAMERA</div>
<video id="video" autoplay muted playsinline></video>
<p class="status" id="status">● 監視待機中</p>
<p class="muted" id="message">カメラはまだ起動していません。</p>
<p class="muted" id="diagnostic">カメラ状態：待機中</p>
</section>

<button class="primary" id="start">▶ 監視を開始する</button>
<div class="buttons">
<button class="secondary" id="break" disabled>☕ 休憩</button>
<button class="secondary" id="finish" disabled>■ 終了・保存</button>
</div>
<button class="secondary" id="repair"
style="width:100%;margin-top:9px" disabled>
↻ カメラを再接続
</button>

<section class="card">
<div class="label">監視設定</div>
<div class="settings">
<label>離席警告まで
<select id="threshold">
<option value="10">10秒</option>
<option value="30" selected>30秒</option>
<option value="60">60秒</option>
</select>
</label>
</div>
<div class="buttons">
<button class="secondary" id="record">🎙 注意音声を録音</button>
<button class="secondary" id="test">🔊 アラームテスト</button>
</div>
<p class="muted" id="recordStatus">
録音なしの場合はアラームだけが鳴ります。
</p>
</section>

<section class="card">
<div class="label">学習履歴</div>
<ul id="history" class="history"></ul>
</section>

<p class="notice">
カメラが止まったときは自動復旧を試みます。
復旧できない場合は「カメラを再接続」を押してください。
他のアプリを開いた時間は離席として記録します。
映像や録音は外部サーバーへ送信しません。
</p>
</div>

<script type="module">

const $ = id => document.getElementById(id);

const BASE =
'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304';

const MODEL =
'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

const HISTORY='studyguard_history';
const VOICE='studyguard_recorded_voice';
const SETTINGS='studyguard_v4_settings';

function read(key, fallback){
  try{return JSON.parse(localStorage.getItem(key))??fallback}
  catch{return fallback}
}

$('threshold').value=read(SETTINGS,{threshold:'30'}).threshold;
$('threshold').onchange=()=>{
  localStorage.setItem(SETTINGS,JSON.stringify({
    threshold:$('threshold').value
  }));
};

let detector=null,stream=null,session=null;
let phase='idle';
let frameId=0,lastInfer=0;
let lastSeen=0,awaySince=0,foundCount=0;
let presentConfirmed=false,warned=false;
let pendingCamera=false,backgroundAt=0;
let lastVideoTime=-1,lastAdvanceAt=0;
let captureStartedAt=0,recoveryCount=0;
let recovering=false,detectErrors=0;

const video=$('video');

function status(title,message,type=''){
  $('status').textContent=title;
  $('status').className='status '+type;
  $('message').textContent=message;
}

function hms(n){
  n=Math.floor(Math.max(0,n));
  return [
    Math.floor(n/3600),
    Math.floor(n%3600/60),
    n%60
  ].map(x=>String(x).padStart(2,'0')).join(':');
}

function render(){
  if(session){
    $('timer').textContent=hms(session.elapsed);
    $('present').textContent=hms(session.present);
    $('away').textContent=hms(session.away);
    $('warnings').textContent=session.warnings+'回';
  }
  $('start').textContent=
    phase==='running'?'✓ 監視中':
    phase==='starting'?'起動中…':
    phase==='idle'?'▶ 監視を開始する':
    '▶ 監視を再開する';

  $('start').disabled=['running','starting','recovering','background'].includes(phase);
  $('break').disabled=!session||['starting','recovering','background'].includes(phase);
  $('finish').disabled=!session||['starting','recovering','background'].includes(phase);
  $('repair').disabled=!session||['starting','recovering','background','break'].includes(phase);

  $('break').textContent=phase==='break'?'▶ 休憩終了':'☕ 休憩';
}

// ======================================
// アラーム音（HTML Audio）
// ======================================

let alarm=null,recorded=null;
let alertWanted=false,soundToken=0;
let soundFallback=null;

function makeWav(){
  const rate=22050,seconds=1.15;
  const count=Math.floor(rate*seconds);
  const b=new ArrayBuffer(44+count*2);
  const d=new DataView(b);
  const word=(p,s)=>{
    for(let i=0;i<s.length;i++)d.setUint8(p+i,s.charCodeAt(i));
  };

  word(0,'RIFF');
  d.setUint32(4,36+count*2,true);
  word(8,'WAVE');
  word(12,'fmt ');
  d.setUint32(16,16,true);
  d.setUint16(20,1,true);
  d.setUint16(22,1,true);
  d.setUint32(24,rate,true);
  d.setUint32(28,rate*2,true);
  d.setUint16(32,2,true);
  d.setUint16(34,16,true);
  word(36,'data');
  d.setUint32(40,count*2,true);

  const pulses=[
    [0,.15,880],[.22,.37,1100],
    [.55,.7,880],[.77,.92,1100]
  ];

  for(let i=0;i<count;i++){
    const t=i/rate;
    let value=0;

    for(const [a,z,f] of pulses){
      if(t>=a&&t<z){
        const env=Math.sin(Math.PI*(t-a)/(z-a));
        value=.5*env*Math.sin(2*Math.PI*f*t);
        break;
      }
    }

    d.setInt16(44+i*2,Math.round(value*32767),true);
  }

  return URL.createObjectURL(
    new Blob([b],{type:'audio/wav'})
  );
}

function prepareAudio(){
  if(!alarm){
    alarm=new Audio(makeWav());
    alarm.preload='auto';
    alarm.loop=true;
  }
  if(!recorded){
    recorded=new Audio();
  }
}

// ユーザーのタップで再生を準備
function primeAudio(){
  prepareAudio();
  if(alertWanted){
    playAlert();
    return;
  }

  alarm.loop=false;
  alarm.currentTime=0;
  const p=alarm.play();
  if(p)p.catch(()=>{});

  setTimeout(()=>{
    if(!alertWanted){
      alarm.pause();
      alarm.currentTime=0;
      alarm.loop=true;
    }
  },120);
}

function stopAlert(){
  soundToken++;
  alertWanted=false;
  clearTimeout(soundFallback);

  if(alarm){
    alarm.pause();
    alarm.currentTime=0;
  }
  if(recorded){
    recorded.pause();
    recorded.currentTime=0;
  }
}

function playAlert(){
  if(!alertWanted||document.hidden)return;

  prepareAudio();

  const token=++soundToken;
  clearTimeout(soundFallback);

  const ring=()=>{
    if(token!==soundToken||!alertWanted)return;
    clearTimeout(soundFallback);

    alarm.loop=true;
    alarm.currentTime=0;

    alarm.play().catch(()=>{
      status('● アラーム再生が制限されました',
        '画面の再接続ボタンを押して音声を有効化してください。','error');
    });
  };

  const clip=localStorage.getItem(VOICE);

  if(!clip){
    ring();
    return;
  }

  recorded.src=clip;
  recorded.currentTime=0;
  recorded.onended=ring;
  recorded.onerror=ring;

  soundFallback=setTimeout(ring,4500);
  recorded.play().catch(ring);
}

function warning(playNow=true){
  if(!session||warned)return;

  warned=true;
  session.warnings++;
  alertWanted=true;

  status('● 勉強してください',
    '離席またはアプリ切替を検知しました。','warn');

  render();

  if(playNow)playAlert();
}

// ======================================
// 注意音声を事前録音
// ======================================

async function recordVoice(){
  if(session){
    $('recordStatus').textContent=
      '監視を終了してから録音してください。';
    return;
  }

  let mic;

  try{
    mic=await navigator.mediaDevices.getUserMedia({
      audio:true,video:false
    });

    const options=MediaRecorder.isTypeSupported('audio/mp4')
      ? {mimeType:'audio/mp4'}:{};

    const rec=new MediaRecorder(mic,options);
    const chunks=[];

    rec.ondataavailable=e=>{
      if(e.data.size)chunks.push(e.data);
    };

    rec.onstop=()=>{
      mic.getTracks().forEach(t=>t.stop());

      const blob=new Blob(chunks,{
        type:rec.mimeType||'audio/mp4'
      });

      const reader=new FileReader();

      reader.onload=()=>{
        try{
          localStorage.setItem(VOICE,reader.result);
          $('recordStatus').textContent=
            '✓ 注意音声を保存しました。離席時に再生します。';
        }catch{
          $('recordStatus').textContent=
            '録音を保存できませんでした。';
        }
      };

      reader.readAsDataURL(blob);
    };

    rec.start();

    $('recordStatus').textContent=
      '● 録音中！「勉強してください」と話してください。';

    setTimeout(()=>{
      if(rec.state==='recording')rec.stop();
    },3000);

  }catch(e){
    if(mic)mic.getTracks().forEach(t=>t.stop());
    $('recordStatus').textContent=
      '録音できませんでした：'+(e.message||e.name);
  }
}

// ======================================
// カメラとAI
// ======================================

function stopCamera(){
  cancelAnimationFrame(frameId);
  frameId=0;

  const old=stream;
  stream=null;

  video.pause();
  video.srcObject=null;

  if(old){
    old.getTracks().forEach(t=>t.stop());
  }
}

async function openCamera(){
  const s=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
      facingMode:'user',
      width:{ideal:320},
      height:{ideal:240},
      frameRate:{ideal:10,max:15}
    }
  });

  if(document.hidden){
    s.getTracks().forEach(t=>t.stop());
    throw new Error('画面が非表示です');
  }

  stream=s;
  video.srcObject=s;

  await video.play();

  const track=s.getVideoTracks()[0];

  track.addEventListener('ended',()=>{
    if(stream===s)recoverCamera('映像の接続が終了しました');
  });

  track.addEventListener('mute',()=>{
    if(stream===s){
      $('diagnostic').textContent='カメラ状態：映像が一時停止';
    }
  });

  lastVideoTime=-1;
  lastAdvanceAt=Date.now();
  captureStartedAt=Date.now();

  $('diagnostic').textContent='カメラ状態：稼働中';
}

async function loadDetector(){
  if(detector)return;

  const {FilesetResolver,PoseLandmarker}=
    await import(BASE+'/vision_bundle.mjs');

  const vision=await FilesetResolver.forVisionTasks(BASE+'/wasm');

  detector=await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:MODEL,
      delegate:'CPU'
    },
    runningMode:'VIDEO',
    numPoses:1,
    minPoseDetectionConfidence:.5,
    minTrackingConfidence:.5
  });
}

function resetDetection(){
  foundCount=0;
  presentConfirmed=false;
  lastSeen=Date.now();
  lastInfer=0;
  detectErrors=0;

  if(!pendingCamera){
    awaySince=0;
    warned=false;
  }
}

async function recoverCamera(reason){
  if(recovering||phase!=='running'||document.hidden)return;

  if(recoveryCount>=2){
    phase='paused';
    stopCamera();
    stopAlert();

    status('● カメラが停止しました',
      '自動復旧の上限に達しました。再接続ボタンを押してください。','error');

    $('diagnostic').textContent='カメラ状態：手動復旧待ち';
    render();
    return;
  }

  recovering=true;
  recoveryCount++;
  accrue(Date.now());
  phase='recovering';

  stopCamera();
  stopAlert();

  status('● カメラを復旧中',reason,'warn');
  $('diagnostic').textContent='カメラ状態：再接続中';
  render();

  try{
    await openCamera();
    resetDetection();

    phase='running';
    status('● 監視を再開しました','カメラを再接続しました。');
    render();
    loop();

  }catch(e){
    phase='paused';
    status('● 復旧に失敗しました',
      '再接続ボタンを押してください：'+e.message,'error');
    render();
  }finally{
    recovering=false;
  }
}

function loop(){
  if(phase!=='running')return;

  frameId=requestAnimationFrame(loop);

  const now=performance.now();

  // 画像解析は約1.2秒に1回
  if(now-lastInfer<1200||video.readyState<2)return;

  // 新しいフレームだけを解析
  if(video.currentTime===lastVideoTime)return;

  lastInfer=now;

  try{
    const result=detector.detectForVideo(video,now);
    detectErrors=0;

    const found=!!result.landmarks?.length;
    const t=Date.now();

    if(found){
      foundCount++;

      if(foundCount>=2){
        stopAlert();
        pendingCamera=false;
        awaySince=0;
        warned=false;
        presentConfirmed=true;
        lastSeen=t;

        status('● 在席を確認中','学習を続けましょう。');
      }

    }else{
      foundCount=0;

      if(pendingCamera||t-lastSeen>3000){
        presentConfirmed=false;
        if(!awaySince)awaySince=t;

        const seconds=(t-awaySince)/1000;

        if(!warned){
          status('● 離席の可能性',
            Math.floor(seconds)+'秒間、人物が検出できません。','warn');
        }

        if(seconds>=Number($('threshold').value)){
          warning();
        }
      }
    }

  }catch(e){
    detectErrors++;

    if(detectErrors>=3){
      phase='paused';
      stopCamera();
      stopAlert();

      status('● AI解析が停止しました',
        '再接続ボタンを押してください：'+e.message,'error');

      render();
    }
  }
}

// ======================================
// 時計・学習記録
// ======================================

function accrue(now){
  if(!session)return;

  const dt=Math.max(0,(now-session.last)/1000);
  session.last=now;

  if(phase==='running'){
    session.elapsed+=dt;

    if(awaySince||pendingCamera)session.away+=dt;
    else if(presentConfirmed)session.present+=dt;
    else session.unknown+=dt;

  }else if(phase==='recovering'){
    session.elapsed+=dt;
    session.unknown+=dt;

  }else if(phase==='paused'){
    session.elapsed+=dt;

    if(pendingCamera)session.away+=dt;
    else session.unknown+=dt;
  }
}

// ======================================
// 監視開始・再開
// ======================================

async function start(){
  if(['starting','running','recovering','background'].includes(phase))return;

  primeAudio();

  const isNew=!session;

  if(session)accrue(Date.now());

  phase='starting';
  status('● 準備中','カメラを起動しています。');
  render();

  try{
    await openCamera();
    await loadDetector();

    if(isNew){
      session={
        started:new Date().toISOString(),
        elapsed:0,present:0,away:0,unknown:0,
        warnings:0,last:Date.now()
      };
    }

    session.last=Date.now();

    resetDetection();
    recoveryCount=0;
    phase='running';

    // アプリ切替後の警報は再開操作時に開始
    if(alertWanted)playAlert();

    status('● 監視中','人物を検出しています。');
    render();
    loop();

  }catch(e){
    stopCamera();
    phase=session?'paused':'idle';

    status('● カメラを開始できません',
      e.message||'起動に失敗しました。','error');
    render();
  }
}

// ======================================
// カメラ停止監視
// ======================================

setInterval(()=>{
  if(phase!=='running'||document.hidden||recovering)return;

  const now=Date.now();
  const track=stream?.getVideoTracks()[0];

  if(!track||track.readyState!=='live'){
    recoverCamera('カメラ接続が切れました');
    return;
  }

  if(video.paused){
    video.play().catch(()=>{});
  }

  if(video.currentTime>lastVideoTime+.04){
    lastVideoTime=video.currentTime;
    lastAdvanceAt=now;
  }

  if(track.muted||now-lastAdvanceAt>8000){
    recoverCamera('映像が更新されなくなりました');
    return;
  }

  if(now-captureStartedAt>30000){
    recoveryCount=0;
  }

  $('diagnostic').textContent=
    'カメラ状態：稼働中 / '+Math.round(video.currentTime)+'秒';
},2000);

// ======================================
// アプリ切替
// ======================================

function onHide(){
  if(!session||phase!=='running')return;

  accrue(Date.now());

  backgroundAt=Date.now();
  phase='background';
  pendingCamera=true;
  awaySince=backgroundAt;

  stopCamera();
  stopAlert();
  render();
}

function onShow(){
  if(!session||phase!=='background'||!backgroundAt)return;

  const now=Date.now();
  const seconds=(now-backgroundAt)/1000;

  session.elapsed+=seconds;
  session.away+=seconds;
  session.last=now;

  awaySince=backgroundAt;
  backgroundAt=0;

  phase='paused';
  pendingCamera=true;
  warned=false;

  if(seconds>=Number($('threshold').value)){
    warning(false);
  }

  status('● アプリ切替を記録しました',
    Math.floor(seconds)+'秒間を離席時間に加算しました。監視を再開してください。','warn');

  render();
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)onHide();
  else onShow();
});

window.addEventListener('pagehide',onHide);
window.addEventListener('pageshow',()=>{
  if(!document.hidden)onShow();
});

// ======================================
// 休憩・終了
// ======================================

function pause(){
  if(['running','paused'].includes(phase)){
    accrue(Date.now());
    stopCamera();
    stopAlert();

    phase='break';
    pendingCamera=false;
    awaySince=0;
    warned=false;

    status('☕ 休憩中','学習時間の計測を一時停止しています。');

  }else if(phase==='break'){
    phase='paused';
    session.last=Date.now();

    status('● 休憩終了','監視を再開してください。');
  }
  render();
  $('break').textContent=phase==='break'?'▶ 休憩終了':'☕ 休憩';
}

function finish(){
  if(!session)return;

  accrue(Date.now());
  stopCamera();
  stopAlert();

  const data=read(HISTORY,[]);

  data.unshift({
    ...session,
    date:new Date().toLocaleString('ja-JP')
  });

  localStorage.setItem(HISTORY,JSON.stringify(data.slice(0,50)));

  session=null;
  phase='idle';
  pendingCamera=false;
  backgroundAt=0;
  awaySince=0;
  warned=false;

  $('timer').textContent='00:00:00';
  $('present').textContent='00:00';
  $('away').textContent='00:00';
  $('warnings').textContent='0回';

  status('✓ 保存しました','お疲れさまでした。');
  $('diagnostic').textContent='カメラ状態：待機中';

  render();
  showHistory();
}

function showHistory(){
  const data=read(HISTORY,[]);
  const list=$('history');
  list.textContent='';

  if(!data.length){
    const li=document.createElement('li');
    li.textContent='まだ記録はありません。';
    list.appendChild(li);
    return;
  }

  data.slice(0,10).forEach(s=>{
    const li=document.createElement('li');
    li.textContent=
      `${s.date} — 合計 ${hms(s.elapsed)} / `+
      `在席 ${hms(s.present)} / `+
      `離席 ${hms(s.away)} / `+
      `注意 ${s.warnings}回`;
    list.appendChild(li);
  });
}

// ======================================
// 操作ボタン
// ======================================

$('start').onclick=start;
$('break').onclick=pause;
$('finish').onclick=finish;
$('record').onclick=recordVoice;

$('repair').onclick=()=>{
  if(!session)return;

  if(phase==='running'){
    accrue(Date.now());
    stopCamera();
    phase='paused';
  }

  start();
};

$('test').onclick=()=>{
  prepareAudio();
  stopAlert();

  alarm.loop=false;
  alarm.currentTime=0;

  alarm.play().catch(e=>{
    status('● アラームの再生に失敗',
      e.message,'error');
  });

  setTimeout(()=>{
    alarm.pause();
    alarm.currentTime=0;
    alarm.loop=true;
  },3000);
};

setInterval(()=>{
  if(!session||phase==='background'||phase==='break')return;

  accrue(Date.now());

  if(phase==='paused'&&pendingCamera&&
     !warned&&awaySince&&
     Date.now()-awaySince>=
       Number($('threshold').value)*1000){
    warning(false);
  }

  render();
},1000);

if(localStorage.getItem(VOICE)){
  $('recordStatus').textContent=
    '✓ 録音済みの注意音声があります。';
}

showHistory();
render();

</script>
</body>
</html>
